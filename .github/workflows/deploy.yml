name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: Required files and links
        run: |
          test -f index.html
          # every local file the page points at must exist
          grep -oE '(src|href)="/[^"#]+"' index.html | sed -E 's/^(src|href)="\/([^"]+)"$/\2/' | while read -r p; do
            test -f "$p" || { echo "missing: $p"; exit 1; }
          done

      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html public/
          cp -R src assets public/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --only hosting:moonscale --project "$PROJECT_ID" --non-interactive

      - name: Check the live site
        run: |
          for URL in https://moonscale.web.app; do
            curl -fsS "$URL/" | grep -q "moonScale"
            curl -fsSI "$URL/src/main.js" | grep -qi "200"
            curl -fsSI "$URL/assets/logos/resilia.png" | grep -qi "200"
            echo "Live at $URL" >> "$GITHUB_STEP_SUMMARY"
          done
